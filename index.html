<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex Morgan — Curriculum Vitae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f3eee5; --inkRGB:233,228,218; --ink:rgb(var(--inkRGB)); --dim:rgba(var(--inkRGB),.66); --faint:rgba(var(--inkRGB),.14);
  --goldRGB:201,164,95; --gold:#c9a45f; --gold2:#e6cc8f; --onGold:#14120d; --bg:#08090d; --glass:rgba(14,16,23,.72);
  --sceneBg:radial-gradient(90% 70% at 40% 45%,#1b2030 0%,#0c0e14 55%,#050609 100%);
  --serif:"Cormorant Garamond",Garamond,Georgia,serif; --sans:Jost,"Helvetica Neue",Arial,sans-serif;
  --panelW:min(500px,40vw);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;
  background:var(--sceneBg);transition:background .6s}

/* header */
.top{position:fixed;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 26px) 0 calc(env(safe-area-inset-left) + 26px);pointer-events:none}
.id{display:flex;align-items:center;gap:12px;pointer-events:auto}
.mono{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px;color:var(--gold2);letter-spacing:.04em}
.id .n{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1;color:var(--ivory)}
.id .r{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.tact{display:flex;gap:8px;pointer-events:auto}
.pill{text-decoration:none;display:inline-block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:10px 15px;border-radius:99px;border:1px solid rgba(var(--goldRGB),.45);color:var(--gold2);transition:background .3s}
.pill:hover{background:rgba(var(--goldRGB),.12)}
.pill.solid{background:var(--gold);color:var(--onGold);border-color:var(--gold);font-weight:500}

/* template picker */
.tpl{position:relative}
#tplMenu{position:absolute;right:0;top:calc(100% + 10px);width:250px;padding:8px;border-radius:16px;background:var(--glass);border:1px solid rgba(var(--goldRGB),.3);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.35);display:none;z-index:9}
#tplMenu.open{display:block;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
#tplMenu .t{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);padding:8px 10px 6px}
#tplMenu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:11px;text-align:left;color:var(--ink);transition:background .25s}
#tplMenu button:hover{background:rgba(var(--inkRGB),.07)}
#tplMenu button.on{background:rgba(var(--goldRGB),.14)}
#tplMenu .sw{display:flex;flex:0 0 auto}
#tplMenu .sw i{width:18px;height:26px;border-radius:4px;margin-right:-6px;box-shadow:0 0 0 1.5px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.2)}
#tplMenu b{display:block;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.1}
#tplMenu small{display:block;font-size:11px;color:var(--dim);margin-top:2px}

/* layout rows in the template menu */
#tplMenu .lw{flex:0 0 auto;width:58px;height:40px;border-radius:6px;background:rgba(var(--inkRGB),.07);position:relative;overflow:hidden}
#tplMenu .lw i{position:absolute;background:rgba(var(--goldRGB),.75);border-radius:2px}
#tplMenu hr{border:0;height:1px;background:rgba(var(--inkRGB),.1);margin:6px 8px}

/* desktop index */
#index{position:fixed;z-index:5;left:calc(env(safe-area-inset-left) + 26px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
#index button{display:flex;align-items:center;gap:12px;padding:7px 0;text-align:left;color:var(--dim);transition:color .35s}
#index button .no{font-family:var(--serif);font-size:15px;width:22px;color:var(--gold);opacity:.7}
#index button .bar{width:14px;height:1px;background:currentColor;opacity:.5;transition:width .45s,opacity .45s,background .45s}
#index button .lb{font-size:11px;letter-spacing:.22em;text-transform:uppercase}
#index button.on{color:var(--ivory)}
#index button.on .bar{width:38px;opacity:1;background:var(--gold)}
#index button:hover{color:var(--ivory)}

/* content panel */
#panel{position:fixed;z-index:5;right:calc(env(safe-area-inset-right) + 26px);top:92px;bottom:26px;width:var(--panelW);
  display:flex;flex-direction:column;background:var(--glass);border:1px solid rgba(var(--goldRGB),.22);border-radius:18px;
  -webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.phead{display:flex;align-items:center;gap:14px;padding:22px 26px 16px;border-bottom:1px solid var(--faint)}
.phead .num{font-family:var(--serif);font-size:44px;font-weight:500;color:var(--gold);line-height:.8;min-width:58px}
.phead .tt{flex:1;min-width:0}
.phead h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1;color:var(--ivory)}
.phead .ds{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.arrows{display:flex;gap:6px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid var(--faint);font-size:18px;color:var(--ink);display:grid;place-items:center;transition:border-color .3s}
.arrows button:hover{border-color:var(--gold)}
#body{flex:1;overflow:auto;padding:22px 26px 30px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#body::-webkit-scrollbar{width:6px}#body::-webkit-scrollbar-thumb{background:rgba(var(--goldRGB),.3);border-radius:9px}

/* content typography */
.lead{font-family:var(--serif);font-size:23px;line-height:1.38;font-weight:400;color:var(--ivory)}
p.t{font-size:15.5px;line-height:1.65;color:var(--dim);margin-top:12px}
.k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 6px}
.stat{border-top:1px solid rgba(var(--goldRGB),.35);padding-top:10px}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:38px;line-height:1;color:var(--gold2)}
.stat span{display:block;font-size:12.5px;line-height:1.35;color:var(--dim);margin-top:6px}
.facts{margin-top:20px;display:grid;gap:9px}
.facts div{display:flex;gap:14px;font-size:15px;line-height:1.4}.facts .k{min-width:94px;padding-top:3px}

.job{border-top:1px solid var(--faint)}
.job:first-child{border-top:0}
.job>button{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:16px 0}
.job .yr{grid-column:1/-1}
.job .role{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;color:var(--ivory)}
.job .org{grid-column:1/2;font-size:14.5px;color:var(--dim)}
.job .pm{grid-row:2/4;grid-column:2;align-self:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;color:var(--gold);transition:transform .35s}
.job.open .pm{transform:rotate(45deg)}
.job ul{list-style:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.job.open ul{grid-template-rows:1fr}
.job ul>div{overflow:hidden}
.job li{position:relative;padding-left:18px;font-size:15px;line-height:1.6;color:var(--dim);margin-bottom:8px}
.job li:before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg)}
.job.open ul>div{padding-bottom:14px}

.proj{padding:18px;border-radius:14px;border:1px solid var(--faint);background:rgba(255,255,255,.025);margin-bottom:12px}
.proj .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.proj h3{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1;color:var(--ivory)}
.proj .role{font-size:13px;color:var(--gold);margin-top:3px;letter-spacing:.04em}
.proj p{font-size:15px;line-height:1.6;color:var(--dim);margin-top:9px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:11px;letter-spacing:.1em;padding:5px 10px;border-radius:99px;border:1px solid rgba(var(--goldRGB),.3);color:var(--gold2)}
.proj a.go{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);text-decoration:none;border-bottom:1px solid rgba(var(--goldRGB),.5);padding-bottom:2px}

.sg{margin-bottom:22px}
.sk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--faint);font-size:15.5px}
.lv{display:flex;gap:6px}
.lv i{width:8px;height:8px;border:1px solid rgba(var(--goldRGB),.55);transform:rotate(45deg) scale(.6);opacity:.6;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.lv i.f{background:var(--gold);border-color:var(--gold);opacity:1;transform:rotate(45deg) scale(1)}

.ed{padding:14px 0;border-bottom:1px solid var(--faint)}
.ed h3{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ivory);line-height:1.15;margin-top:4px}
.ed .o{font-size:14.5px;color:var(--dim);margin-top:2px}
.ed p{font-size:14.5px;color:var(--dim);line-height:1.55;margin-top:6px;font-style:italic;font-family:var(--serif);font-size:17px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.langs span{font-size:14px;padding:8px 13px;border-radius:10px;border:1px solid var(--faint)}
.langs span b{font-weight:400;color:var(--gold2)}

.mail{font-family:var(--serif);font-size:clamp(26px,4.6vw,34px);font-weight:500;color:var(--ivory);word-break:break-all;line-height:1.15;margin:8px 0 14px}
.crow{display:flex;gap:8px;flex-wrap:wrap}
.clist{margin-top:24px}
.clist div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--faint);font-size:15.5px}
.clist div span:last-child{color:var(--dim);text-align:right}
.avail{margin-top:22px;padding:16px 18px;border-radius:14px;border:1px solid rgba(var(--goldRGB),.3);background:rgba(var(--goldRGB),.06);font-family:var(--serif);font-size:19px;line-height:1.4}

/* entry animation */
.in>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* chips (mobile index) */
#chips{display:none}

#hint{position:fixed;z-index:6;left:var(--hintX,50%);transform:translateX(-50%);bottom:40px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  opacity:0;transition:opacity .8s;pointer-events:none;white-space:nowrap}
#hint.show{opacity:1}
#toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%) translateY(-8px);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  padding:9px 16px;border-radius:99px;background:var(--gold);color:var(--onGold);opacity:0;transition:all .4s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:var(--bg);transition:opacity 1.2s}
#loader.gone{opacity:0;pointer-events:none}
#loader .m{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--gold2);position:relative}
#loader .m:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid transparent;border-top-color:var(--gold);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

/* ---------- layout templates (desktop) ---------- */
@media (min-width:900px){
  body[data-layout="deck"] #panel{right:auto;left:calc(env(safe-area-inset-left) + 26px)}
  body[data-layout="deck"] #index{left:auto;right:calc(env(safe-area-inset-right) + 26px);align-items:flex-end}
  body[data-layout="deck"] #index button{flex-direction:row-reverse;text-align:right}
  body[data-layout="carousel"] #panel{left:50%;right:auto;transform:translateX(-50%);top:auto;bottom:22px;width:min(1000px,calc(100vw - 52px));height:min(40vh,370px)}
  body[data-layout="carousel"] #index{display:none}
  body[data-layout="carousel"] #chips{display:flex;position:fixed;z-index:5;top:84px;left:50%;transform:translateX(-50%);gap:6px}
  body[data-layout="carousel"] #chips button{font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:8px 13px;border-radius:99px;border:1px solid var(--faint);color:var(--dim);transition:all .35s}
  body[data-layout="carousel"] #chips button.on{border-color:var(--gold);color:var(--gold2);background:rgba(var(--goldRGB),.1)}
  body[data-layout="carousel"] #body .in{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:start}
  body[data-layout="carousel"] #body .in>.lead,body[data-layout="carousel"] #body .in>.stats,body[data-layout="carousel"] #body .in>.mail,body[data-layout="carousel"] #body .in>.k{grid-column:1/-1}
}

/* ---------- phones & narrow screens ---------- */
@media (max-width:899px){
  .top{padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px)}
  .mono{width:34px;height:34px;font-size:14px}
  .id .n{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.id .r{font-size:8.5px;letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .id{min-width:0}.id>div:last-child{min-width:0;overflow:hidden}
  .tact .pill.copy{display:none}
  .pill{padding:9px 13px}
  #index{display:none}
  #chips{display:flex;position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 60px);left:0;right:0;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  #chips button{flex:0 0 auto;font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:8px 12px;border-radius:99px;border:1px solid var(--faint);color:var(--dim);transition:all .35s}
  #chips button.on{border-color:var(--gold);color:var(--gold2);background:rgba(var(--goldRGB),.1)}
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:min(54dvh,560px);border-radius:22px 22px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom)}
  .phead{padding:16px 18px 12px}
  .phead .num{font-size:36px;min-width:34px}
  .phead h2{font-size:28px}
  #body{padding:16px 18px 26px}
  .lead{font-size:20px}
  .stat b{font-size:30px}
  #hint{top:auto;bottom:calc(min(54dvh,560px) + 14px);transform:translateX(-50%)}
}
/* ✦ AI summary card */
.ai{font-family:var(--ai-sans);color:var(--ai-ink)}
.ai-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ai-star{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(var(--ai-accRGB),.14);color:var(--ai-acc);font-size:14px;animation:aiTw 3.6s ease-in-out infinite}
@keyframes aiTw{50%{transform:rotate(180deg) scale(1.08)}}
.ai-h b{font-family:var(--ai-serif);font-size:21px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.ai-tag{margin-left:auto;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ai-acc);border:1px solid rgba(var(--ai-accRGB),.4);border-radius:99px;padding:4px 9px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.ai-x{font-size:24px;line-height:1;color:var(--ai-dim);padding:0 2px 2px 6px}
.ai-text{font-family:var(--ai-serif);font-size:17.5px;line-height:1.5;min-height:1.5em}
.ai:not(.done) .ai-text::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--ai-acc);animation:aiCaret .8s steps(2) infinite}
.ai.loading .ai-text::after,.ai.loading .ai-text{display:none}
@keyframes aiCaret{50%{opacity:0}}
.ai-sk{display:none;gap:9px;flex-direction:column;margin:6px 0 4px}
.ai.loading .ai-sk{display:flex}
.ai-sk i{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--ai-line),rgba(var(--ai-accRGB),.22),var(--ai-line));background-size:200% 100%;animation:aiSh 1.3s linear infinite}
.ai-sk i:nth-child(2){width:92%}.ai-sk i:nth-child(3){width:96%}.ai-sk i:nth-child(4){width:60%}
@keyframes aiSh{to{background-position:-200% 0}}
.ai-pts{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ai-pts li{font-size:12px;line-height:1.3;padding:6px 10px;border-radius:99px;background:rgba(var(--ai-accRGB),.1);border:1px solid rgba(var(--ai-accRGB),.25);opacity:0;transform:translateY(6px);animation:aiIn .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--k) * 110ms)}
.ai-fit{font-family:var(--ai-serif);font-style:italic;font-size:15.5px;line-height:1.4;color:var(--ai-dim);margin-top:12px;opacity:0;transition:opacity .6s .35s}
.ai.done .ai-fit{opacity:1}
@keyframes aiIn{to{opacity:1;transform:none}}
.ai-f{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ai-line)}
.ai-note{flex:1 1 150px;font-size:11px;line-height:1.4;color:var(--ai-dim)}
.ai-btns{display:flex;gap:6px;flex:0 0 auto}
.ai-b{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:8px 11px;border-radius:99px;border:1px solid rgba(var(--ai-accRGB),.45);color:var(--ai-acc);white-space:nowrap}
.ai-b:hover{background:rgba(var(--ai-accRGB),.1)}
.ai-b[hidden]{display:none}

:root{--ai-serif:var(--serif);--ai-sans:var(--sans)}
body{--ai-ink:var(--ink);--ai-dim:var(--dim);--ai-acc:var(--gold2);--ai-accRGB:var(--goldRGB);--ai-line:var(--faint)}
#aiView{position:absolute;inset:0;z-index:4;padding:24px 26px 22px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
body.ai-open #aiView{opacity:1;visibility:visible;transform:none;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
body.ai-open #panel>.phead,body.ai-open #panel>#body{opacity:0;pointer-events:none;transition:opacity .25s}
#aiView .ai-text{font-size:19px;color:var(--ivory)}
#aiView .ai-h b{font-size:26px;color:var(--ivory)}
.pill.ai-pill{display:inline-flex;align-items:center;gap:6px}
body.ai-open .pill.ai-pill{background:rgba(var(--goldRGB),.16)}
@media (max-width:899px){.pill.ai-pill{display:none}#aiView{padding:18px 18px 22px}}
#chips .ai-chipm{display:none}
@media (max-width:899px){#chips .ai-chipm{display:inline-flex;align-items:center;gap:5px;border-color:rgba(var(--goldRGB),.5);color:var(--gold2)}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="A brass card file holding the sections of this CV. Use the arrow keys to flip between sections."></canvas>

<header class="top">
  <div class="id"><div class="mono" id="hMono">AM</div><div><div class="n" id="hName">Alex Morgan</div><div class="r" id="hRole">Creative Technologist</div></div></div>
  <div class="tact"><button class="pill ai-pill" id="hAI" aria-pressed="false">✦<span>AI summary</span></button><div class="tpl"><button class="pill" id="hTpl" aria-haspopup="true" aria-expanded="false">Template</button><div id="tplMenu" role="menu"></div></div><button class="pill copy" id="hCopy">Copy email</button><button class="pill solid" id="hContact">Contact</button></div>
</header>
<nav id="index" aria-label="CV sections"></nav>

<!-- =========================================================
     2. CARD ARTWORK — the face of each card, drawn on a canvas.
        "mr" pass marks which parts are polished gold.
     ========================================================= -->
<script>
window.CardArt = (function(){
  const W=1024,H=640,TAU=Math.PI*2,ROMAN=['I','II','III','IV','V','VI','VII','VIII'];
  const SERIF='"Cormorant Garamond",Garamond,Georgia,serif', SANS='Jost,"Helvetica Neue",Arial,sans-serif';
  function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
  function styler(ctx,mode,dark){
    const mr=mode==='mr',T=window.CV_THEME.card;
    const paper=dark?T.cover:T.paper, ink=dark?T.coverInk:T.ink;
    return {
      paper:()=>mr?'rgb(0,225,0)':paper,
      ink:()=>mr?'rgb(0,205,0)':ink,
      soft:()=>mr?'rgb(0,205,0)':hexA(ink,dark?.66:.6),
      gold:()=>{ if(mr) return 'rgb(0,64,255)';
        const g=ctx.createLinearGradient(0,0,W,H);
        const st=dark?T.metalDark:T.metalLight;
        [0,.3,.52,.76,1].forEach((o,i)=>g.addColorStop(o,st[i]));return g; }
    };
  }
  function spaced(ctx,t,x,y,sp,align){
    const ch=[...t],ws=ch.map(c=>ctx.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
    let cx=align==='left'?x:align==='right'?x-tot:x-tot/2;const al=ctx.textAlign;ctx.textAlign='left';
    ch.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=ws[i]+sp;});ctx.textAlign=al;return tot;
  }
  function fit(ctx,t,font,size,maxW){let s=size;ctx.font=font.replace('{s}',s);while(ctx.measureText(t).width>maxW&&s>12){s-=2;ctx.font=font.replace('{s}',s);}return s;}
  function grain(ctx,dark){
    let sd=11;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
    for(let i=0;i<2200;i++){ctx.fillStyle=r()>.5?'rgba(255,255,255,.045)':'rgba(0,0,0,.03)';ctx.fillRect(r()*W,r()*H,1+r()*2,1+r()*2);}
    const g=ctx.createRadialGradient(W*.45,H*.4,W*.15,W/2,H/2,W*.75);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,dark?'rgba(0,0,0,.35)':'rgba(90,70,40,.1)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  function border(ctx,S){
    ctx.strokeStyle=S.gold();ctx.lineWidth=4;ctx.strokeRect(24,24,W-48,H-48);
    ctx.lineWidth=1.5;ctx.strokeRect(38,38,W-76,H-76);
    ctx.fillStyle=S.gold();
    for(const [x,y] of [[38,38],[W-38,38],[38,H-38],[W-38,H-38]]){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-6,-6,12,12);ctx.restore();}
  }
  function tab(ctx,S,i,title,name){
    ctx.textBaseline='alphabetic';
    ctx.fillStyle=S.gold();ctx.font=`500 25px ${SANS}`;spaced(ctx,`${ROMAN[i]} · ${title.toUpperCase()}`,78,104,7,'left');
    ctx.fillStyle=S.soft();ctx.font=`400 21px ${SANS}`;spaced(ctx,name.toUpperCase(),W-78,104,6,'right');
    ctx.strokeStyle=S.gold();ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(78,126);ctx.lineTo(W-78,126);ctx.stroke();
  }
  function frontDeck(ctx,S,i,cv){ // playing-card style, corner indices
    const s=cv.sections[i];
    const corner=()=>{ctx.textAlign='left';ctx.fillStyle=S.gold();ctx.font=`600 52px ${SERIF}`;ctx.fillText(ROMAN[i],70,118);ctx.font=`500 17px ${SANS}`;spaced(ctx,s.title.toUpperCase(),72,148,5,'left');};
    corner();ctx.save();ctx.translate(W,H);ctx.rotate(Math.PI);corner();ctx.restore();
    ctx.textAlign='center';
    if(i===0){
      ctx.strokeStyle=S.gold();ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(W/2,215,78,0,TAU);ctx.stroke();
      ctx.fillStyle=S.gold();ctx.font=`600 72px ${SERIF}`;ctx.fillText(cv.initials,W/2,240);
      ctx.fillStyle=S.ink();fit(ctx,cv.name,`600 {s}px ${SERIF}`,86,600);ctx.fillText(cv.name,W/2,395);
      ctx.fillStyle=S.gold();ctx.font=`500 24px ${SANS}`;spaced(ctx,cv.role.toUpperCase(),W/2,445,7);
    }else{
      ctx.fillStyle=S.gold();for(const dx of [-34,0,34]){ctx.save();ctx.translate(W/2+dx,205);ctx.rotate(Math.PI/4);ctx.fillRect(-7,-7,14,14);ctx.restore();}
      ctx.fillStyle=S.ink();fit(ctx,s.title,`600 {s}px ${SERIF}`,124,620);ctx.fillText(s.title,W/2,360);
      ctx.fillStyle=S.soft();const d=i===5?cv.email:s.desc;fit(ctx,d,`italic 400 {s}px ${SERIF}`,40,560);ctx.fillText(d,W/2,425);
    }
  }
  function frontMin(ctx,S,i,cv){ // minimal and modern
    const s=cv.sections[i],num=String(i+1).padStart(2,'0');
    ctx.save();ctx.globalAlpha=.16;ctx.fillStyle=S.gold();ctx.textAlign='right';ctx.font=`500 430px ${SERIF}`;ctx.fillText(num,W-50,H-70);ctx.restore();
    ctx.textAlign='left';ctx.fillStyle=S.soft();ctx.font=`400 19px ${SANS}`;spaced(ctx,`${cv.name.toUpperCase()} — CURRICULUM VITAE`,82,104,6,'left');
    ctx.strokeStyle=S.gold();ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(82,300);ctx.lineTo(170,300);ctx.stroke();
    ctx.fillStyle=S.ink();const t=i===0?cv.name:s.title;fit(ctx,t,`italic 500 {s}px ${SERIF}`,118,700);ctx.fillText(t,78,420);
    ctx.fillStyle=S.gold();ctx.font=`500 22px ${SANS}`;spaced(ctx,(i===0?cv.role:(i===5?cv.email:s.desc)).toUpperCase(),82,480,6,'left');
  }
  function front(ctx,S,i,cv){
    const L=window.CV_LAYOUT_KEY;if(L==='deck')return frontDeck(ctx,S,i,cv);if(L==='carousel')return frontMin(ctx,S,i,cv);
    const s=cv.sections[i];
    tab(ctx,S,i,s.title,i===0?'Curriculum Vitae':cv.name);
    if(i===0){
      ctx.strokeStyle=S.gold();ctx.lineWidth=3;ctx.beginPath();ctx.arc(215,358,122,0,TAU);ctx.stroke();
      ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(215,358,107,0,TAU);ctx.stroke();
      ctx.fillStyle=S.gold();ctx.textAlign='center';fit(ctx,cv.initials,`600 {s}px ${SERIF}`,118,170);ctx.fillText(cv.initials,215,398);
      ctx.textAlign='left';ctx.fillStyle=S.ink();fit(ctx,cv.name,`600 {s}px ${SERIF}`,100,560);ctx.fillText(cv.name,380,345);
      ctx.fillStyle=S.gold();ctx.font=`500 27px ${SANS}`;spaced(ctx,cv.role.toUpperCase(),383,402,7,'left');
      ctx.fillStyle=S.soft();ctx.font=`italic 400 36px ${SERIF}`;ctx.fillText(cv.location,382,462);
    } else {
      ctx.fillStyle=S.gold();ctx.textAlign='center';ctx.font=`500 200px ${SERIF}`;ctx.fillText(['','II','III','IV','V','VI','VII'][i]||'',205,438);
      ctx.strokeStyle=S.gold();ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(340,200);ctx.lineTo(340,520);ctx.stroke();
      ctx.textAlign='left';ctx.fillStyle=S.ink();fit(ctx,s.title,`600 {s}px ${SERIF}`,118,580);ctx.fillText(s.title,384,352);
      ctx.fillStyle=S.soft();const d=i===5?cv.email:s.desc;fit(ctx,d,`italic 400 {s}px ${SERIF}`,40,560);ctx.fillText(d,388,418);
    }
    ctx.textAlign='right';ctx.fillStyle=S.soft();ctx.font=`400 19px ${SANS}`;spaced(ctx,`${String(i+1).padStart(2,'0')} / ${String(cv.sections.length).padStart(2,'0')}`,W-80,H-72,5,'right');
  }
  function back(ctx,S,i,cv){
    ctx.strokeStyle=S.gold();ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2-20,74,0,TAU);ctx.stroke();
    ctx.fillStyle=S.gold();ctx.textAlign='center';ctx.font=`600 70px ${SERIF}`;ctx.fillText(cv.initials,W/2,H/2+4);
    ctx.fillStyle=S.soft();ctx.font=`400 20px ${SANS}`;spaced(ctx,cv.name.toUpperCase(),W/2,H/2+100,8);
  }
  function draw(i,side,mode,scale){
    scale=scale||1;const cv=window.CV,dark=i===0;
    const c=document.createElement('canvas');c.width=Math.round(W*scale);c.height=Math.round(H*scale);
    const ctx=c.getContext('2d');ctx.scale(scale,scale);const S=styler(ctx,mode,dark);
    ctx.fillStyle=S.paper();ctx.fillRect(0,0,W,H);if(mode!=='mr')grain(ctx,dark);
    if(window.CV_LAYOUT_KEY==='carousel'){ctx.strokeStyle=S.gold();ctx.lineWidth=2;ctx.strokeRect(30,30,W-60,H-60);}else border(ctx,S);
    (side==='back'?back:front)(ctx,S,i,cv);return c;
  }
  return {draw,W,H,ROMAN};
})();
</script>

<script>
(function(){
  const CV=window.CV,N=CV.sections.length,R=window.CardArt.ROMAN;
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let cur=fromHash(),ready=false,lvTimer;

  function fromHash(){const h=(location.hash||'').slice(1);const i=CV.sections.findIndex(s=>s.key===h);return i<0?0:i;}
  function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1700);}
  async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'Copied');}catch(e){toast(text);}}
  const link=l=>l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)}</a>`:esc(l.text);

  const views={
    profile:()=>`<div class="in">
      <p class="lead" style="--d:0">${esc(CV.summary)}</p>
      <p class="t" style="--d:1">${esc(CV.about)}</p>
      <div class="stats" style="--d:2">${CV.stats.map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div>
      <div class="facts" style="--d:3">
        <div><span class="k">Based in</span><span>${esc(CV.location)}</span></div>
        <div><span class="k">Currently</span><span>${esc(CV.experience[0].role)}, ${esc(CV.experience[0].org)}</span></div>
        <div><span class="k">Email</span><span>${esc(CV.email)}</span></div>
      </div></div>`,
    experience:()=>`<div class="in">${CV.experience.map((j,i)=>`<div class="job${i===0?' open':''}" style="--d:${i}">
      <button aria-expanded="${i===0}"><span class="k yr">${esc(j.from)} — ${esc(j.to)}</span><span class="role">${esc(j.role)}</span>
      <span class="pm">+</span><span class="org">${esc(j.org)} · ${esc(j.place)}</span></button>

  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false); camera.aspect = W / H;
  const p = document.getElementById('panel').getBoundingClientRect();
  let L = 0, R = 0, T = 0, B = 0;
  if (W >= 900) {
    T = 70; B = 20;
    if (p.left > W * .5) { R = W - p.left + 10; L = 190; }
    else if (p.right < W * .5) { L = p.right + 10; R = 190; }
    else { B = H - p.top + 10; T = 130; }
  }
  else { B = H - p.top + 6; T = Math.min(118, H * .16); }
  const fW = Math.max(.3, (W - L - R) / W), fH = Math.max(.25, (H - T - B) / H);
  offXT = (R - L) / 2; offYT = (B - T) / 2;
  const v = VIEW[LAY()] || VIEW.file, needW = v.w, needH = v.h;
  distT = Math.max(needH / (2 * tanH * fH), needW / (2 * tanH * camera.aspect * fW), 3);
  scene.fog.near = distT + 1.2; scene.fog.far = distT + 17;
  document.documentElement.style.setProperty('--hintX', ((L + (W - R)) / 2) + 'px');
}
addEventListener('resize', layout);
new ResizeObserver(layout).observe(document.getElementById('panel'));

/* ---------------- navigation ---------------- */
function go(i) {
  if (!built) return;
  i = Math.max(0, Math.min(N - 1, i));
  current = i; UI.show(i); UI.hideHint();
  try { history.replaceState(null, '', '#' + CV.sections[i].key); } catch (e) {}
}
function applyLayout() { const f = LAY() === 'file'; spindle.forEach(m => m.visible = f); if (built) applyTheme(); layout(); }
window.CVScene = { go: i => go(((i % N) + N) % N), next: () => go(current + 1), prev: () => go(current - 1), setTheme: () => { if (built) applyTheme(); }, setLayout: applyLayout };
// UI arrows wrap around; scrolling and swiping stop at the ends
const goWrap = i => go(((i % N) + N) % N);
window.CVScene.go = goWrap;

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null, wheelAcc = 0, wheelLock = 0;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, yaw: dragYaw, mouse: e.pointerType === 'mouse' }; canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { tpx = e.clientX / innerWidth * 2 - 1; tpy = -(e.clientY / innerHeight * 2 - 1); }
  if (down && down.mouse) dragYaw = Math.max(-.7, Math.min(.7, down.yaw + (e.clientX - down.x) * .004));
});
canvas.addEventListener('pointerup', e => {
  if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y, wasMouse = down.mouse; down = null;
  if (!wasMouse && Math.hypot(dx, dy) > 40) {
    if (Math.abs(dy) > Math.abs(dx)) go(current + (dy < 0 ? 1 : -1)); else go(current + (dx < 0 ? 1 : -1));
    return;
  }
  if (Math.hypot(dx, dy) > 8) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(cards.map(c => c.mesh), false)[0];
  if (hit) { const i = hit.object.userData.index; go(i === current ? (current + 1) % N : i); }
});
canvas.addEventListener('pointerleave', () => { tpx = 0; tpy = 0; });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const now = performance.now(); if (now < wheelLock) return;
  wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 60) { go(current + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 650; }
}, { passive: false });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (['ArrowDown', 'ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); go(current + 1); }
  else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(current - 1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
});
addEventListener('hashchange', () => { const i = CV.sections.findIndex(s => '#' + s.key === location.hash); if (i >= 0 && i !== current) go(i); });

/* ---------------- loop ---------------- */
const clock = new THREE.Clock(); let time = 0;
const angD = (t, c) => ((t - c + Math.PI) % TAU + TAU) % TAU - Math.PI;
function frame() {
  const dt = Math.min(clock.getDelta(), .05); time += dt;
  introT = Math.min(1, introT + dt / 2.6); const ie = 1 - Math.pow(1 - introT, 3);
  const kc = 1 - Math.exp(-dt * 3.2);
  dist += (distT - dist) * kc; offX += (offXT - offX) * kc; offY += (offYT - offY) * kc;
  camera.setViewOffset(innerWidth, innerHeight, offX, offY, innerWidth, innerHeight);
  px += (tpx - px) * kc; py += (tpy - py) * kc;
  if (!down) dragYaw *= Math.exp(-dt * 1.6);
  yawT = dragYaw + px * .12 + Math.sin(time * .2) * .04;
  yaw += (yawT - yaw) * (1 - Math.exp(-dt * 4));

  // cards: farther cards move a little slower so the flip cascades
  for (let i = 0; i < N; i++) {
    const c = cards[i], s = introT < .35 ? slot(i, current, true) : slot(i, current, false);
    const sp = 7.5 - Math.min(Math.abs(i - current), 4) * .9, k = 1 - Math.exp(-dt * sp);
    c.rx += (s.rx - c.rx) * k; c.rz += (s.rz - c.rz) * k; c.ry += angD(s.ry, c.ry) * k;
    c.lift += (s.lift - c.lift) * k; c.z += (s.z - c.z) * k; c.py += (s.py - c.py) * k;
    c.pivot.position.y = c.py; c.pivot.rotation.set(c.rx, c.ry, c.rz);
    const act = i === current ? 1 : 0;
    c.mesh.position.set(0, c.lift + act * Math.sin(time * 1.2) * .012, c.z);
    c.mesh.rotation.set(-act * py * .05, act * px * .1, act * Math.sin(time * .7) * .006);
  }
  file.rotation.y = yaw;

  const vw = VIEW[LAY()] || VIEW.file; target.lerp(vw.t, kc); EL += (vw.el - EL) * kc;
  const el = EL + py * .03 + (1 - ie) * .25, d = dist + (1 - ie) * 3;
  camera.position.set(target.x, target.y + Math.sin(el) * d, target.z + Math.cos(el) * d);
  camera.lookAt(target);

  dustMat.uniforms.uT.value = time;
  syncMirrors();
  renderer.render(scene, camera);
}

/* ---------------- start ---------------- */
async function start() {
  UI.message('Setting the type');
  try {
    await Promise.race([
      Promise.all(['600 100px "Cormorant Garamond"', '500 200px "Cormorant Garamond"', 'italic 400 40px "Cormorant Garamond"', '500 25px Jost', '400 20px Jost'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 4000))
    ]);
  } catch (e) {}
  UI.message('Polishing the brass');
  await new Promise(r => setTimeout(r, 0));
  buildCards(); buildMirrors(); applyTheme(true); spindle.forEach(m => m.visible = LAY() === 'file');
  built = true; layout(); dist = distT; offX = offXT; offY = offYT;
  renderer.compile(scene, camera);
  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => UI.ready());
}
start().catch(err => { console.error(err); UI.ready(true); });
</script>
<script>
/* ✦ AI summary: reads this CV and writes a short summary for whoever is looking at it.
   With no API key in window.CV.ai it shows the sample in window.CV.aiSample instead. */
window.AISummary = (function () {
  const CV = window.CV, $q = (r, s) => r.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cfg = () => Object.assign({ provider: 'anthropic', apiKey: '', model: '', baseURL: '' }, CV.ai || {});
  function cvText() {
    const L = [`${CV.name}, ${CV.role}, ${CV.location}`, CV.summary, CV.about || '', 'Experience:'];
    (CV.experience || []).forEach(j => L.push(`- ${j.role}, ${j.org} (${j.from}–${j.to}): ${(j.points || []).join(' ')}`));
    L.push('Skills: ' + (CV.skills || []).map(g => `${g.group}: ${g.items.map(i => i[0]).join(', ')}`).join('; '));
    L.push('Projects: ' + (CV.projects || []).map(p => `${p.name} (${p.role}): ${p.text || ''}`).join(' | '));
    L.push('Education: ' + (CV.education || []).map(e => `${e.title}, ${e.org}`).join('; '));
    if (CV.awards) L.push('Awards: ' + CV.awards.map(a => a[1]).join('; '));
    return L.join('\n');
  }
  const prompt = () => `Read this CV and write a short summary for a recruiter. Reply with JSON only, no other text, in this shape:
{"summary": "three warm, specific sentences in the third person", "strengths": ["three strengths, at most seven words each"], "bestFor": "one sentence starting with 'Best fit:'"}

CV:
${cvText()}`;
  async function ask() {
    const c = cfg(), body = prompt();
    if (c.provider === 'openai') {
      const r = await fetch((c.baseURL || 'https://api.openai.com/v1').replace(/\/$/, '') + '/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + c.apiKey },
        body: JSON.stringify({ model: c.model, temperature: .6, messages: [{ role: 'user', content: body }] }) });
      if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 140)}`);
      return (await r.json()).choices[0].message.content;
    }
    const r = await fetch((c.baseURL || 'https://api.anthropic.com').replace(/\/$/, '') + '/v1/messages', { method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': c.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: c.model || 'claude-haiku-5-5', max_tokens: 600, messages: [{ role: 'user', content: body }] }) });
    if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 140)}`);
    return (await r.json()).content.map(b => b.text || '').join('');
  }
  function parse(t) { const m = /\{[\s\S]*\}/.exec(t || ''); if (m) { try { const j = JSON.parse(m[0]); if (j.summary) return { summary: j.summary, strengths: (j.strengths || []).slice(0, 4), bestFor: j.bestFor || '' }; } catch (e) {} } return { summary: (t || '').trim(), strengths: [], bestFor: '' }; }
  const cacheKey = () => { let h = 0; const s = cvText() + cfg().model; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return 'ai-summary-' + h; };

  function mount(host, opts = {}) {
    host.innerHTML = `<div class="ai"><div class="ai-h"><span class="ai-star">✦</span><b>AI summary</b><span class="ai-tag"></span>${opts.close ? '<button class="ai-x" aria-label="Close">×</button>' : ''}</div>
      <div class="ai-sk"><i></i><i></i><i></i><i></i></div><p class="ai-text"></p><ul class="ai-pts"></ul><p class="ai-fit"></p>
      <div class="ai-f"><span class="ai-note"></span><span class="ai-btns"><button class="ai-b" data-act="regen">↻ Regenerate</button><button class="ai-b" data-act="copy">Copy</button></span></div></div>`;
    const el = $q(host, '.ai'), text = $q(el, '.ai-text'), pts = $q(el, '.ai-pts'), fit = $q(el, '.ai-fit'), tag = $q(el, '.ai-tag'), note = $q(el, '.ai-note'), regen = $q(el, '[data-act=regen]');
    let data = null, run = 0;
    if (opts.close) $q(el, '.ai-x').onclick = opts.close;
    function show(d, label, msg) {
      const id = ++run; data = d; el.classList.remove('loading'); tag.textContent = label; note.textContent = msg || '';
      text.textContent = ''; pts.innerHTML = ''; fit.textContent = ''; el.classList.remove('done');
      let i = 0; (function type() { if (id !== run) return; i = Math.min(d.summary.length, i + 2 + Math.floor(Math.random() * 3)); text.textContent = d.summary.slice(0, i);
        if (i < d.summary.length) setTimeout(type, 16); else { pts.innerHTML = d.strengths.map((s, k) => `<li style="--k:${k}">${esc(s)}</li>`).join(''); fit.textContent = d.bestFor; el.classList.add('done'); } })();
    }
    async function generate(force) {
      const c = cfg(), sample = CV.aiSample || { summary: CV.summary, strengths: [], bestFor: '' };
      regen.hidden = !c.apiKey;
      if (!c.apiKey) { show(sample, 'Sample', 'Add an API key in the CV settings to write this live.'); return; }
      if (!force) { try { const hit = sessionStorage.getItem(cacheKey()); if (hit) { show(JSON.parse(hit), 'Live', `Written by ${c.model || 'AI'} from this CV.`); return; } } catch (e) {} }
      run++; el.classList.add('loading'); el.classList.remove('done'); tag.textContent = 'Writing…'; note.textContent = ''; text.textContent = ''; pts.innerHTML = ''; fit.textContent = '';
      try { const d = parse(await ask()); try { sessionStorage.setItem(cacheKey(), JSON.stringify(d)); } catch (e) {} show(d, 'Live', `Written by ${c.model || 'AI'} from this CV. Worth a quick check.`); }
      catch (e) { const m = String(e.message || e), why = /Failed to fetch|NetworkError|Load failed/i.test(m) ? 'the browser couldn\'t reach the service: no internet, a firewall, or it doesn\'t accept requests from web pages'
          : /^40[13]/.test(m) ? 'the key was rejected, so check it was copied in full' : /^404/.test(m) ? 'the model name wasn\'t found' : /^(402|429)/.test(m) ? 'no credit left, or too many requests' : m.slice(0, 90);
        console.warn('AI summary:', m); show(sample, 'Sample', `Couldn't write it live: ${why}. Showing the sample.`); }
    }
    regen.onclick = () => generate(true);
    $q(el, '[data-act=copy]').onclick = async () => { if (!data) return; const t = [data.summary, ...data.strengths.map(s => '• ' + s), data.bestFor].filter(Boolean).join('\n');
      try { await navigator.clipboard.writeText(t); note.textContent = 'Copied.'; } catch (e) { note.textContent = 'Select the text to copy it.'; } };
    let started = false;
    return { start() { if (!started) { started = true; generate(false); } }, el };
  }
  return { mount };
})();

/* ✦ AI summary opens inside the panel; choosing any section closes it again */
(function(){
  const body=document.body,btn=document.getElementById('hAI');
  const close=()=>{body.classList.remove('ai-open');btn.setAttribute('aria-pressed','false');};
  const AI=AISummary.mount(document.getElementById('aiView'),{close});
  const toggle=e=>{e&&e.stopPropagation();const o=!body.classList.contains('ai-open');body.classList.toggle('ai-open',o);btn.setAttribute('aria-pressed',o);if(o)AI.start();};
  btn.onclick=toggle;
  // on phones it lives at the start of the section chips instead of the crowded top bar
  const chip=document.createElement('button');chip.className='ai-chipm';chip.innerHTML='✦ AI summary';chip.onclick=toggle;document.getElementById('chips').prepend(chip);
  ['index','chips','prev','next'].forEach(id=>{const e=document.getElementById(id);e&&e.addEventListener('click',close);});
  addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.key))close();});
  document.getElementById('scene').addEventListener('pointerdown',close);
})();
</script>
